<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译工具 - 简洁版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1200px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            font-size: 24px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .header .config-row {
            flex: 1;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .header .form-group {
            flex: 2;
            margin-bottom: 0;
        }

        .header .form-group.model-id-group {
            flex: 1;
        }

        .header label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .header input {
            font-size: 12px;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .label-row label {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .language-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .language-select {
            flex: 1;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .swap-btn {
            background: #f0f0f0;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }

        .swap-btn:hover {
            background: #667eea;
            color: white;
            transform: rotate(180deg);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            margin-bottom: 0;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .columns {
            display: flex;
            gap: 20px;
            align-items: stretch;
            height: 560px;
        }

        .column {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .column-input .form-group {
            display: flex;
            flex-direction: column;
        }

        #inputText {
            flex: none;
            height: 120px;
            resize: none;
        }

        .system-prompt-group {
            flex: 1;
            margin-top: 0;
            min-height: 0;
        }

        .system-prompt-group textarea {
            flex: 1;
            resize: none;
            min-height: 0;
        }

        .result-area {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 0;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .result-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-content {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            font-family: monospace;
            flex: 1;
            min-height: 0;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            background: #e7f3ff;
            color: #0066cc;
        }

        .input-hint {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .input-hint code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: #667eea;
        }

        .btn-reset {
            padding: 5px 12px;
            border: 1px solid #667eea;
            border-radius: 6px;
            background: white;
            color: #667eea;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔮 AI 翻译助手</h1>
            <div class="config-row">
                <div class="form-group">
                    <label>🔗 API地址</label>
                    <input type="text" id="requestPath" placeholder="请输入 API 地址" value="https://api.deepseek.com/chat/completions">
                </div>

                <div class="form-group">
                    <label>🔑 API Key</label>
                    <input type="text" id="apiKey" placeholder="请输入您的 API Key" value="">
                </div>

                <div class="form-group model-id-group">
                    <label>🤖 模型ID</label>
                    <input type="text" id="modelName" placeholder="请输入模型ID" value="deepseek-v4-flash">
                </div>
            </div>
        </div>
        <div class="content">
            <div class="columns">
                <div class="column column-input">
                    <div class="form-group">
                        <label>📝 输入文本</label>
                        <textarea id="inputText" rows="4" placeholder="请输入要翻译的文本...">hello world</textarea>
                    </div>

                    <div class="form-group system-prompt-group">
                        <div class="label-row">
                            <label>⚙️ 系统提示词</label>
                            <button type="button" id="resetPromptBtn" class="btn-reset">↩️ 恢复默认提示词</button>
                        </div>
                        <textarea id="systemPrompt" rows="12" placeholder="请输入系统提示词..."></textarea>
                        <div class="input-hint">支持占位符：<code>${from}</code> 源语言、<code>${to}</code> 目标语言、<code>${field}</code> 领域</div>
                    </div>

                    <div class="language-row">
                        <div class="language-select">
                            <label>🌐 源语言</label>
                            <select id="fromLang">
                                <option value="zh">中文</option>
                                <option value="en" selected>英语</option>
                                <option value="ja">日语</option>
                                <option value="ko">韩语</option>
                                <option value="fr">法语</option>
                                <option value="de">德语</option>
                            </select>
                        </div>
                        <button class="swap-btn" id="swapBtn">⇄</button>
                        <div class="language-select">
                            <label>🎯 目标语言</label>
                            <select id="toLang">
                                <option value="zh" selected>中文</option>
                                <option value="en">英语</option>
                                <option value="ja">日语</option>
                                <option value="ko">韩语</option>
                                <option value="fr">法语</option>
                                <option value="de">德语</option>
                            </select>
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="btn btn-primary" id="translateBtn">🚀 开始翻译</button>
                        <button class="btn btn-secondary" id="clearBtn">🗑️ 清空结果</button>
                    </div>
                </div>

                <div class="column column-output">
                    <div class="result-area">
                        <div class="result-label">翻译结果</div>
                        <div class="result-content" id="resultContent">等待翻译...</div>
                        <div class="status" id="status">⚡ 准备就绪</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SSE 流式响应解析方法：将原始流数据转换为翻译内容
        function parseSSEToContent(sseBuffer) {
            let fullContent = '';
            const lines = sseBuffer.split('\n');
            for (const line of lines) {
                if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                    try {
                        const data = JSON.parse(line.slice(6));
                        if (data.choices && data.choices[0] && data.choices[0].delta && data.choices[0].delta.content) {
                            fullContent += data.choices[0].delta.content;
                        }
                    } catch (e) {
                        // 忽略解析错误的行
                    }
                }
            }
            return fullContent;
        }

        const DEFAULT_SYSTEM_PROMPT = `
                    <instruction>
					## Role
					你是一位40岁的翻译专家，精通\${field}领域的'\${from}-\${to}'翻译

					## Skills
					### Skill_1: 根据输入文本的语言进行翻译，如果是'\${from}'则输出'\${to}'，如果是'\${to}'则输出'\${from}'
					### Skill_2: 如果输入文本的语义与\${field}领域有关，请按照\${field}领域进行翻译；否则，请按照通用领域进行翻译
					### Skill_3: 给出输入文本最合理的3个翻译
					### Skill_4: 如果输入的文本有多个单词，将原文分词，并逐一输出'中学水平及以上'单词的译文
					### Skill_5: 若分词后的单词存在多个语义，则辨析适用场景
					### Skill_6: 如果无法翻译，输出“我只能在'\${from}-\${to}'之间翻译”

					## Constraint
					### Constraint_1: 只能输出翻译结果，不要输出思考过程，不要输出其他无关的信息
					### Constraint_2: 以自然语言段落形式输出
					### Constraint_3: 如果输入的文本有多个单词，分为全文翻译和分词翻译两部分输出
					### Constraint_4: 如果输入的文本只有一个单词，分词翻译部分输出“无需分词翻译”
					### Constraint_5: 全文翻译部分和分词翻译部分之间有一个空行分割
					### Constraint_6: 输入为纯文本，输出为纯文本，不要输出图表

					## Output 
					### Output_1: 全文翻译的输出是纯文本构成的有序列表，序号为123
					### Output_2: 全文翻译的每个结果都换行输出。结果之间不要有空行
					### Output_3: 分词翻译的输出是键值对构成的有序列表，key是'单词(音标)'，value是分词译文，序号为123
					### Output_4: 分词翻译的单词如果有多个译文，输出与语境最相近的三个，格式为'分词译文1 / 分词译文2 / 分词译文3'
					### Output_5: 分词翻译的单词不要以大写字母开头
					### Output_6: 分词翻译的每个结果都换行输出，结果之间不要有空行
					### Output_7: 分词翻译的每个分词译文都需要进行辨析
					### Output_8: 分词辨析的输出是键值对构成的有序列表，key是分词译文，value是分词译文辨析，序号为abc
					### Output_9: 分词辨析的每个结果都换行输出，结果前要有一个空格，结果之间不要有空行
					</instruction>

					<output>
					可以翻译且输入的文本有多个单词时，输出格式如下
					全文翻译：
					1.译文1
					2.译文2
					3.译文3

					分词翻译：
					1.分词1(音标1): 分词译文1a / 分词译文1b / 分词译文1c
					 a.分词译文1a： 分词译文1a辨析
					 b.分词译文1b： 分词译文1b辨析
					 c.分词译文1c： 分词译文1c辨析
					2.分词分词2(音标2): 分词译文2a / 分词译文2b
					 a.分词译文2a： 分词译文2a辨析
					 b.分词译文2b： 分词译文2b辨析
					</output>

					<output>
					可以翻译且输入的文本只有一个单词时，输出格式如下
					全文翻译：
					1.译文1
					2.译文2

					分词翻译：无需分词翻译
					</output>

					<output>
					无法翻译时输出格式：我只能在'\${from}-\${to}'之间翻译
					</output>
            `;

        // 将提示词中的占位符替换为实际值
        function renderSystemPrompt(promptTemplate, from, to, field) {
            return promptTemplate
                .replace(/\$\{from\}/g, from)
                .replace(/\$\{to\}/g, to)
                .replace(/\$\{field\}/g, field);
        }

        async function translateWithLogging(text, from, to, apiKey, requestPath, options) {
            const { config, setResult, utils, model, systemPrompt } = options;
            const { tauriFetch: fetch } = utils;

            let buffer = '';

            let field = 'IT';

            const finalSystemPrompt = renderSystemPrompt(systemPrompt, from, to, field);

            try {
                let { userId, role } = config;
                
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                }
                
                const body = {
                    "model": model,
                    "messages": [
                        {
                            "role": "system",
                            "content": finalSystemPrompt
                        },
                        {
                            "role": "user",
                            "content": text
                        }
                    ],
                    "stream": true,
                    "reasoning_effort": "high",
                    "thinking": {"type": "disabled"},
                }

                const response = await window.fetch(requestPath, {
                    headers: headers,
                    method: 'POST',
                    url: requestPath,
                    body: JSON.stringify(body)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                if (response.ok) {
                    // 用于累积已解析的内容，实现流式实时更新
                    let lastParsedContent = '';
                    
                    while (true) {
                        const {done, value} = await reader.read();
                        if (done) {
                            // 最终完整解析
                            const fullContent = parseSSEToContent(buffer);
                            if (setResult) {
                                setResult(fullContent);
                            }
                            return fullContent;
                        }
                
                        const chunk = decoder.decode(value, { stream: true });
                        buffer += chunk;
                        
                        // 实时解析当前累积的 SSE 数据，获取最新翻译内容
                        const currentParsedContent = parseSSEToContent(buffer);
                        // 只有当内容有变化时才调用 setResult，避免不必要的更新
                        if (currentParsedContent !== lastParsedContent && setResult) {
                            lastParsedContent = currentParsedContent;
                            setResult(currentParsedContent);
                        }
                    }
                } else {
                    const errorText = await response.text();
                    const errorMsg = `HTTP ${response.status}: ${errorText}`;
                    if (setResult) {
                        setResult(errorMsg);
                    }
                    return errorMsg;
                }

            } catch(error) {
                const errorMsg = "http request error, buffer: '" + buffer + "'. error: " + JSON.stringify(error) + ".";
                if (setResult) {
                    setResult(errorMsg);
                }
                return errorMsg;
            }
        }

        class TranslateApp {
            constructor() {
                this.requestPathInput = document.getElementById('requestPath');
                this.apiKeyInput = document.getElementById('apiKey');
                this.modelNameInput = document.getElementById('modelName');
                this.systemPromptInput = document.getElementById('systemPrompt');
                this.resetPromptBtn = document.getElementById('resetPromptBtn');
                this.inputText = document.getElementById('inputText');
                this.fromLang = document.getElementById('fromLang');
                this.toLang = document.getElementById('toLang');
                this.translateBtn = document.getElementById('translateBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.swapBtn = document.getElementById('swapBtn');
                this.resultContent = document.getElementById('resultContent');
                this.status = document.getElementById('status');

                this.bindEvents();
                this.loadSavedSettings();
            }

            bindEvents() {
                this.translateBtn.addEventListener('click', () => this.handleTranslate());
                this.clearBtn.addEventListener('click', () => this.handleClear());
                this.swapBtn.addEventListener('click', () => this.handleSwap());
                this.requestPathInput.addEventListener('change', () => this.saveSettings());
                this.apiKeyInput.addEventListener('change', () => this.saveSettings());
                this.modelNameInput.addEventListener('change', () => this.saveSettings());
                this.systemPromptInput.addEventListener('change', () => this.saveSettings());
                this.resetPromptBtn.addEventListener('click', () => this.handleResetPrompt());
            }

            loadSavedSettings() {
                const savedRequestPath = localStorage.getItem('qwen_request_path');
                const savedApiKey = localStorage.getItem('qwen_api_key');
                const savedModelName = localStorage.getItem('qwen_model_name');
                const savedSystemPrompt = localStorage.getItem('qwen_system_prompt');
                
                if (savedRequestPath) {
                    this.requestPathInput.value = savedRequestPath;
                }
                if (savedApiKey) {
                    this.apiKeyInput.value = savedApiKey;
                }
                if (savedModelName) {
                    this.modelNameInput.value = savedModelName;
                }
                if (savedSystemPrompt) {
                    this.systemPromptInput.value = savedSystemPrompt;
                } else {
                    this.systemPromptInput.value = DEFAULT_SYSTEM_PROMPT;
                }
            }

            saveSettings() {
                const requestPath = this.requestPathInput.value.trim();
                const apiKey = this.apiKeyInput.value.trim();
                const modelName = this.modelNameInput.value.trim();
                const systemPrompt = this.systemPromptInput.value;
                
                if (requestPath) {
                    localStorage.setItem('qwen_request_path', requestPath);
                } else {
                    localStorage.removeItem('qwen_request_path');
                }
                
                if (apiKey) {
                    localStorage.setItem('qwen_api_key', apiKey);
                } else {
                    localStorage.removeItem('qwen_api_key');
                }
                
                if (modelName) {
                    localStorage.setItem('qwen_model_name', modelName);
                } else {
                    localStorage.removeItem('qwen_model_name');
                }
                
                if (systemPrompt) {
                    localStorage.setItem('qwen_system_prompt', systemPrompt);
                } else {
                    localStorage.removeItem('qwen_system_prompt');
                }
            }

            handleResetPrompt() {
                this.systemPromptInput.value = DEFAULT_SYSTEM_PROMPT;
                this.saveSettings();
                this.updateStatus('↩️ 已恢复默认提示词');
            }

            updateStatus(message, isError = false) {
                this.status.textContent = message;
                this.status.style.background = isError ? '#fee' : '#e7f3ff';
                this.status.style.color = isError ? '#c33' : '#0066cc';
            }

            async handleTranslate() {
                const requestPath = this.requestPathInput.value.trim();
                if (!requestPath) {
                    this.updateStatus('⚠️ 请先输入 API 地址', true);
                    this.resultContent.textContent = '错误：请输入 API 地址';
                    return;
                }

                const apiKey = this.apiKeyInput.value.trim();
                if (!apiKey) {
                    this.updateStatus('⚠️ 请先输入 API Key', true);
                    this.resultContent.textContent = '错误：请输入 API Key';
                    return;
                }

                const text = this.inputText.value.trim();
                if (!text) {
                    this.updateStatus('⚠️ 请输入要翻译的文本', true);
                    this.resultContent.textContent = '错误：文本不能为空';
                    return;
                }

                const from = this.fromLang.value;
                const to = this.toLang.value;

                const model = this.modelNameInput.value.trim();
                if (!model) {
                    this.updateStatus('⚠️ 请先输入模型ID', true);
                    this.resultContent.textContent = '错误：请输入模型ID';
                    return;
                }

                const systemPrompt = this.systemPromptInput.value.trim() || DEFAULT_SYSTEM_PROMPT;
                this.saveSettings();

                this.updateStatus('🔄 翻译中，请稍候...');
                this.resultContent.textContent = '翻译中...';
                this.translateBtn.disabled = true;
                this.translateBtn.textContent = '翻译中...';

                try {
                    const result = await translateWithLogging(text, from, to, apiKey, requestPath, {
                        config: { 
                            userId: 'web_user', 
                            role: 'user' 
                        },
                        model,
                        systemPrompt,
                        setResult: (parsedContent) => {
                            if (parsedContent) {
                                this.resultContent.textContent = parsedContent;
                            } else if (this.resultContent.textContent === '翻译中...') {
                                this.resultContent.textContent = '接收数据中...';
                            }
                        },
                        utils: { 
                            tauriFetch: window.fetch 
                        }
                    });

                    if (result && !result.startsWith('HTTP') && !result.startsWith('http request error')) {
                        this.resultContent.textContent = result;
                        this.updateStatus('✅ 翻译完成！');
                    } else if (result && (result.startsWith('HTTP') || result.startsWith('http request error'))) {
                        this.resultContent.textContent = '翻译失败：' + result;
                        this.updateStatus('❌ 翻译失败，请检查 API 地址和 Key 是否正确', true);
                    } else {
                        if (this.resultContent.textContent === '翻译中...' || this.resultContent.textContent === '接收数据中...') {
                            this.resultContent.textContent = '未获取到翻译结果';
                        }
                        this.updateStatus('⚠️ 未获取到有效结果');
                    }
                } catch (error) {
                    this.resultContent.textContent = `错误：${error.message || '未知错误'}`;
                    this.updateStatus('❌ 翻译出错', true);
                } finally {
                    this.translateBtn.disabled = false;
                    this.translateBtn.textContent = '🚀 开始翻译';
                }
            }

            handleClear() {
                this.inputText.value = '';
                this.resultContent.textContent = '等待翻译...';
                this.updateStatus('✨ 已清空');
            }

            handleSwap() {
                const fromValue = this.fromLang.value;
                const toValue = this.toLang.value;
                this.fromLang.value = toValue;
                this.toLang.value = fromValue;
                this.updateStatus('🔄 语言方向已互换');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.app = new TranslateApp();
        });
    </script>
</body>
</html>
